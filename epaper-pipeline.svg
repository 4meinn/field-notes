<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" viewBox="0 0 760 616" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="616" fill="#ffffff"/>
  <text x="30" y="34" font-size="13" font-weight="700" fill="#52606d" letter-spacing="0.5">DAILY ePAPER CLIPPING &#183; PIPELINE</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <!-- step boxes -->
  <g>
    <!-- 1 -->
    <rect x="30" y="56" width="440" height="58" rx="8" fill="#f4f6f8" stroke="#cdd5df"/>
    <text x="48" y="80" font-size="14.5" font-weight="700" fill="#1f2933">1 &#183; Saved search</text>
    <text x="48" y="99" font-size="11.5" fill="#52606d">owned editions only &#183; the tracked term lives in the account, not the code</text>
    <line x1="250" y1="114" x2="250" y2="140" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 2 -->
    <rect x="30" y="144" width="440" height="58" rx="8" fill="#f4f6f8" stroke="#cdd5df"/>
    <text x="48" y="168" font-size="14.5" font-weight="700" fill="#1f2933">2 &#183; Result list</text>
    <text x="48" y="187" font-size="11.5" fill="#52606d">each hit carries a stable article ID &#8594; perfect dedup key</text>
    <line x1="250" y1="202" x2="250" y2="228" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 3 -->
    <rect x="30" y="232" width="440" height="58" rx="8" fill="#f4f6f8" stroke="#cdd5df"/>
    <text x="48" y="256" font-size="14.5" font-weight="700" fill="#1f2933">3 &#183; Headless browser</text>
    <text x="48" y="275" font-size="11.5" fill="#52606d">reused login session &#183; the password is never stored by the job</text>
    <line x1="250" y1="290" x2="250" y2="316" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 4 (accent) -->
    <rect x="30" y="320" width="440" height="58" rx="8" fill="#eaf1fb" stroke="#15509e"/>
    <text x="48" y="344" font-size="14.5" font-weight="700" fill="#15509e">4 &#183; Lift article out of the scroll box</text>
    <text x="48" y="363" font-size="11.5" fill="#3a5a86">escape the fixed-height overflow container that clips the print</text>
    <line x1="250" y1="378" x2="250" y2="404" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 5 -->
    <rect x="30" y="408" width="440" height="58" rx="8" fill="#f4f6f8" stroke="#cdd5df"/>
    <text x="48" y="432" font-size="14.5" font-weight="700" fill="#1f2933">5 &#183; Clean PDF per article</text>
    <text x="48" y="451" font-size="11.5" fill="#52606d">small print stylesheet applied to the lifted node</text>
    <line x1="250" y1="466" x2="250" y2="492" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 6 -->
    <rect x="30" y="496" width="440" height="58" rx="8" fill="#f4f6f8" stroke="#cdd5df"/>
    <text x="48" y="520" font-size="14.5" font-weight="700" fill="#1f2933">6 &#183; Archive  +  dated outbox</text>
    <text x="48" y="539" font-size="11.5" fill="#52606d">kept archive of singles &#183; dated folder to mail, then empty</text>
  </g>

  <!-- callout on step 4 -->
  <line x1="470" y1="349" x2="512" y2="349" stroke="#15509e" stroke-width="1.5"/>
  <rect x="512" y="300" width="226" height="98" rx="8" fill="#ffffff" stroke="#15509e" stroke-dasharray="4 3"/>
  <text x="528" y="324" font-size="12" font-weight="700" fill="#15509e">Why the toolbar &amp; clipping?</text>
  <text x="528" y="344" font-size="11" fill="#3a5a86">A headless page&#8209;to&#8209;PDF render</text>
  <text x="528" y="359" font-size="11" fill="#3a5a86">never fires <tspan font-family="monospace">beforeprint</tspan>, so</text>
  <text x="528" y="374" font-size="11" fill="#3a5a86">the site&#8217;s print prep never runs.</text>
  <text x="528" y="389" font-size="11" fill="#3a5a86">Move the node out &#8212; don&#8217;t delete it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
